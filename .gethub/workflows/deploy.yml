name: PrepTrack CI/CD

on:

  push:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 18


      - name: Install Backend Dependencies
        run: |
          cd server
          npm install


      - name: Check Backend Build
        run: |
          cd server
          npm run dev &
          sleep 10