<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>PrepTrack Dashboard</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            background:#f5f7fb;
        }

        .card{
            border-radius:20px;
        }

        .navbar-brand{
            font-size:30px;
            font-weight:bold;
        }

        table{
            background:white;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark px-4">

    <a class="navbar-brand">
        PrepTrack Dashboard
    </a>

    <button
        class="btn btn-danger"
        onclick="logout()"
    >
        Logout
    </button>

</nav>


<div class="container mt-5">

    <!-- ANALYTICS CARDS -->

    <div class="row mb-4">

        <div class="col-md-4 mb-3">

            <div class="card shadow text-center p-4">

                <h5>Total DSA Questions</h5>

                <h2 id="totalQuestions">
                    0
                </h2>

            </div>

        </div>


        <div class="col-md-4 mb-3">

            <div class="card shadow text-center p-4">

                <h5>Total Applications</h5>

                <h2 id="totalApplications">
                    0
                </h2>

            </div>

        </div>


        <div class="col-md-4 mb-3">

            <div class="card shadow text-center p-4">

                <h5>Total Interviews</h5>

                <h2 id="totalInterviews">
                    0
                </h2>

            </div>

        </div>

    </div>


    <!-- CHARTS -->

    <div class="row mb-5">

        <div class="col-md-6 mb-4">

            <div class="card shadow p-4">

                <h4 class="mb-4">
                    DSA Difficulty Chart
                </h4>

                <canvas id="dsaChart"></canvas>

            </div>

        </div>


        <div class="col-md-6 mb-4">

            <div class="card shadow p-4">

                <h4 class="mb-4">
                    Job Status Chart
                </h4>

                <canvas id="jobChart"></canvas>

            </div>

        </div>

    </div>


    <!-- DSA FORM -->

    <div class="card shadow p-4 mb-4">

        <h2 class="mb-4">
            Add DSA Question
        </h2>

        <form id="dsaForm">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Question Title"
                        id="title"
                        required
                    >

                </div>

                <div class="col-md-3 mb-3">

                    <select
                        class="form-select"
                        id="difficulty"
                    >
                        <option>Easy</option>
                        <option>Medium</option>
                        <option>Hard</option>
                    </select>

                </div>

                <div class="col-md-3 mb-3">

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Topic"
                        id="topic"
                        required
                    >

                </div>

            </div>


            <div class="mb-3">

                <textarea
                    class="form-control"
                    placeholder="Notes"
                    id="notes"
                ></textarea>

            </div>

            <button class="btn btn-dark">
                Add Question
            </button>

        </form>

    </div>



    <!-- DSA TABLE -->

    <div class="card shadow p-4 mb-5">

        <h3 class="mb-4">
            Solved Questions
        </h3>


        <!-- SEARCH + FILTER -->

        <div class="row mb-3">

            <div class="col-md-6 mb-3">

                <input
                    type="text"
                    class="form-control"
                    placeholder="Search Question"
                    id="searchQuestion"
                    onkeyup="loadQuestions()"
                >

            </div>


            <div class="col-md-6 mb-3">

                <select
                    class="form-select"
                    id="filterDifficulty"
                    onchange="loadQuestions()"
                >

                    <option value="">
                        All Difficulties
                    </option>

                    <option value="Easy">
                        Easy
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="Hard">
                        Hard
                    </option>

                </select>

            </div>

        </div>


        <table class="table table-bordered">

            <thead class="table-dark">

                <tr>
                    <th>Title</th>
                    <th>Difficulty</th>
                    <th>Topic</th>
                    <th>Notes</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>



    <!-- JOB TRACKER -->

    <div class="card shadow p-4 mt-5">

        <h3 class="mb-4">
            Job Application Tracker
        </h3>

        <form id="jobForm">

            <div class="row">

                <div class="col-md-4 mb-3">

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Company Name"
                        id="company"
                        required
                    >

                </div>

                <div class="col-md-4 mb-3">

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Role"
                        id="role"
                        required
                    >

                </div>

                <div class="col-md-4 mb-3">

                    <select
                        class="form-select"
                        id="status"
                    >
                        <option>Applied</option>
                        <option>Interview</option>
                        <option>Rejected</option>
                        <option>Selected</option>
                    </select>

                </div>

            </div>


            <div class="row">

                <div class="col-md-6 mb-3">

                    <input
                        type="date"
                        class="form-control"
                        id="appliedDate"
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Notes"
                        id="jobNotes"
                    >

                </div>

            </div>

            <button class="btn btn-primary">
                Add Application
            </button>

        </form>

    </div>



    <!-- JOB TABLE -->

    <div class="card shadow p-4 mt-4 mb-5">

        <h3 class="mb-4">
            Applications
        </h3>


        <!-- SEARCH + FILTER -->

        <div class="row mb-3">

            <div class="col-md-6 mb-3">

                <input
                    type="text"
                    class="form-control"
                    placeholder="Search Company"
                    id="searchCompany"
                    onkeyup="loadJobs()"
                >

            </div>


            <div class="col-md-6 mb-3">

                <select
                    class="form-select"
                    id="filterStatus"
                    onchange="loadJobs()"
                >

                    <option value="">
                        All Status
                    </option>

                    <option value="Applied">
                        Applied
                    </option>

                    <option value="Interview">
                        Interview
                    </option>

                    <option value="Rejected">
                        Rejected
                    </option>

                    <option value="Selected">
                        Selected
                    </option>

                </select>

            </div>

        </div>


        <table class="table table-bordered">

            <thead class="table-dark">

                <tr>
                    <th>Company</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Notes</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="jobTableBody">

            </tbody>

        </table>

    </div>

</div>



<script>

const token = localStorage.getItem("token");

if(!token){

    window.location.href = "login.html";
}



// LOGOUT
function logout(){

    localStorage.removeItem("token");

    window.location.href = "login.html";
}



// ================= LOAD QUESTIONS =================
async function loadQuestions(){

    const response = await fetch(
        "https://preptrack-8zrj.onrender.com/api/dsa/all",
        {
            headers:{
                "Authorization": token
            }
        }
    );

    const data = await response.json();

    const tableBody =
        document.getElementById("tableBody");

    tableBody.innerHTML = "";


    const searchValue =
        document.getElementById("searchQuestion")
        .value
        .toLowerCase();


    const difficultyValue =
        document.getElementById("filterDifficulty")
        .value;


    const filteredData = data.filter(question => {

        const matchesSearch =
            question.title.toLowerCase()
            .includes(searchValue);

        const matchesDifficulty =
            difficultyValue === "" ||
            question.difficulty === difficultyValue;

        return matchesSearch && matchesDifficulty;
    });


    filteredData.forEach(question => {

        tableBody.innerHTML += `
        
        <tr>
            <td>${question.title}</td>
            <td>${question.difficulty}</td>
            <td>${question.topic}</td>
            <td>${question.notes}</td>

            <td>
                <button
                    class="btn btn-danger btn-sm"
                    onclick="deleteQuestion(${question.id})"
                >
                    Delete
                </button>
            </td>
        </tr>

        `;
    });
}



// ================= ADD QUESTION =================
const dsaForm =
    document.getElementById("dsaForm");

dsaForm.addEventListener("submit",
async (e) => {

    e.preventDefault();

    const title =
        document.getElementById("title").value;

    const difficulty =
        document.getElementById("difficulty").value;

    const topic =
        document.getElementById("topic").value;

    const notes =
        document.getElementById("notes").value;


    const response = await fetch(
        "https://preptrack-8zrj.onrender.com/api/dsa/add",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "Authorization": token
            },

            body: JSON.stringify({
                title,
                difficulty,
                topic,
                notes
            })
        }
    );

    const data = await response.json();

    alert(data.message);

    dsaForm.reset();

    loadQuestions();

    loadAnalytics();
});



// ================= DELETE QUESTION =================
async function deleteQuestion(id){

    await fetch(
        `https://preptrack-8zrj.onrender.com/api/dsa/delete/${id}`,
        {
            method:"DELETE",

            headers:{
                "Authorization": token
            }
        }
    );

    loadQuestions();

    loadAnalytics();
}



// ================= LOAD JOBS =================
async function loadJobs(){

    const response = await fetch(
        "https://preptrack-8zrj.onrender.com/api/jobs/all",
        {
            headers:{
                "Authorization": token
            }
        }
    );

    const data = await response.json();

    const tableBody =
        document.getElementById("jobTableBody");

    tableBody.innerHTML = "";


    const searchValue =
        document.getElementById("searchCompany")
        .value
        .toLowerCase();


    const statusValue =
        document.getElementById("filterStatus")
        .value;


    const filteredData = data.filter(job => {

        const matchesSearch =
            job.company_name.toLowerCase()
            .includes(searchValue);

        const matchesStatus =
            statusValue === "" ||
            job.status === statusValue;

        return matchesSearch && matchesStatus;
    });


    filteredData.forEach(job => {

        tableBody.innerHTML += `
        
        <tr>
            <td>${job.company_name}</td>
            <td>${job.role}</td>
            <td>${job.status}</td>
            <td>${job.applied_date}</td>
            <td>${job.notes}</td>

            <td>
                <button
                    class="btn btn-danger btn-sm"
                    onclick="deleteJob(${job.id})"
                >
                    Delete
                </button>
            </td>
        </tr>

        `;
    });
}



// ================= ADD JOB =================
const jobForm =
    document.getElementById("jobForm");

jobForm.addEventListener("submit",
async (e) => {

    e.preventDefault();

    const company_name =
        document.getElementById("company").value;

    const role =
        document.getElementById("role").value;

    const status =
        document.getElementById("status").value;

    const applied_date =
        document.getElementById("appliedDate").value;

    const notes =
        document.getElementById("jobNotes").value;


    const response = await fetch(
        "https://preptrack-8zrj.onrender.com/api/jobs/add",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "Authorization": token
            },

            body: JSON.stringify({
                company_name,
                role,
                status,
                applied_date,
                notes
            })
        }
    );

    const data = await response.json();

    alert(data.message);

    jobForm.reset();

    loadJobs();

    loadAnalytics();
});



// ================= DELETE JOB =================
async function deleteJob(id){

    await fetch(
        `https://preptrack-8zrj.onrender.com/api/jobs/delete/${id}`,
        {
            method:"DELETE",

            headers:{
                "Authorization": token
            }
        }
    );

    loadJobs();

    loadAnalytics();
}



// ================= ANALYTICS =================
async function loadAnalytics(){

    const dsaResponse = await fetch(
        "https://preptrack-8zrj.onrender.com/api/dsa/all",
        {
            headers:{
                "Authorization": token
            }
        }
    );

    const dsaData = await dsaResponse.json();


    const jobResponse = await fetch(
        "https://preptrack-8zrj.onrender.com/api/jobs/all",
        {
            headers:{
                "Authorization": token
            }
        }
    );

    const jobData = await jobResponse.json();


    document.getElementById("totalQuestions")
        .innerText = dsaData.length;

    document.getElementById("totalApplications")
        .innerText = jobData.length;


    const interviewCount = jobData.filter(
        job => job.status === "Interview"
    ).length;

    document.getElementById("totalInterviews")
        .innerText = interviewCount;


    // DSA CHART
    const easy = dsaData.filter(
        q => q.difficulty === "Easy"
    ).length;

    const medium = dsaData.filter(
        q => q.difficulty === "Medium"
    ).length;

    const hard = dsaData.filter(
        q => q.difficulty === "Hard"
    ).length;


    new Chart(
        document.getElementById("dsaChart"),
        {
            type: "bar",

            data: {
                labels: ["Easy", "Medium", "Hard"],

                datasets: [{
                    label: "Questions",
                    data: [easy, medium, hard]
                }]
            }
        }
    );


    // JOB CHART
    const applied = jobData.filter(
        job => job.status === "Applied"
    ).length;

    const interview = jobData.filter(
        job => job.status === "Interview"
    ).length;

    const rejected = jobData.filter(
        job => job.status === "Rejected"
    ).length;

    const selected = jobData.filter(
        job => job.status === "Selected"
    ).length;


    new Chart(
        document.getElementById("jobChart"),
        {
            type: "pie",

            data: {

                labels: [
                    "Applied",
                    "Interview",
                    "Rejected",
                    "Selected"
                ],

                datasets: [{
                    data: [
                        applied,
                        interview,
                        rejected,
                        selected
                    ]
                }]
            }
        }
    );
}



loadQuestions();

loadJobs();

loadAnalytics();

</script>

</body>
</html>
